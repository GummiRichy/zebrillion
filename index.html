<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zebrillion · the lecture dive</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"><style id="zb-style">
:root{--navy:#050a14;--ink:#c6d5ec;--dim:rgba(125,147,184,.85);--pink:#ff5c8a;--cyan:#4de3ff;--panel:rgba(11,20,37,.9);--edge:rgba(125,160,210,.32);
--t-H:#8fa3c4;--t-G:#ff9f43;--t-S:#4de3ff;--t-P:#ff5252;--t-D:#9d7bff;--t-Z:#ffd166;--t-X:#3d4f6e}
.cb{--t-H:#d7e1f2;--t-G:#ffb35c;--t-S:#7deaff;--t-P:#ff7bac;--t-D:#bfa7ff;--t-Z:#ffe08a;--t-X:#a3b6d6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:'VT323',ui-monospace,monospace;font-size:20px;overflow:hidden;-webkit-font-smoothing:none}
button,input,textarea,select{font-family:inherit}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#world{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.crt{position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);opacity:.45}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:89;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.6))}
.reduce .crt{opacity:.2}
.ch{clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.screen{position:fixed;inset:0;z-index:10;display:none}
.screen.on{display:block}
.hidden{display:none!important}
.btn{background:#0e1a2f;color:#e8f0ff;border:3px solid #6fd3f0;letter-spacing:.22em;font-size:22px;padding:10px 18px;cursor:pointer;box-shadow:0 0 0 3px #0a1222 inset,0 0 18px rgba(77,227,255,.18);text-transform:uppercase;transition:background .15s,transform .1s}
.btn:hover{background:#15274a}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:clamp(26px,5vw,36px);padding:18px 12px;width:100%;letter-spacing:.28em}
.btn.pink{background:#e9577f;color:#0b1220;border-color:#ff9fbd;box-shadow:0 0 0 3px #3a0f1e inset,0 0 18px rgba(255,92,138,.3)}
.btn.pink:hover{background:#ff6a92}
.btn.ghost{background:rgba(10,18,32,.72);border:2px solid var(--edge);font-size:18px;padding:8px 14px;box-shadow:none;color:#aac0e4}
.btn.ghost:hover{border-color:#6fd3f0;color:#e8f0ff}
.btn.sm{font-size:16px;padding:6px 10px;letter-spacing:.14em}
.iconbtn{position:fixed;z-index:60;width:46px;height:38px;background:rgba(40,52,74,.75);border:2px solid rgba(160,185,220,.25);color:#d6e2f5;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{border-color:#6fd3f0}
#menuBtn{top:16px;left:12px}#soundBtn{top:16px;right:12px}#setBtn{top:62px;right:12px}
body.play #menuBtn,body.play #soundBtn{top:84px}
body.play #setBtn{display:none}
.mascot{top:0;left:0}
/* HOME */
.home-top{position:absolute;top:0;left:0;right:0;height:56%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.logo{font-size:clamp(58px,13vw,148px);line-height:.9;color:#ffe3ec;letter-spacing:.05em;text-shadow:-4px 0 #ff4f7b,4px 0 #2bb8e6,0 6px 0 rgba(20,40,80,.3);margin:0}
.logo.small{font-size:38px;text-shadow:-2px 0 #ff4f7b,2px 0 #4de3ff}
.sub{font-size:clamp(22px,4vw,34px);letter-spacing:.55em;color:#7fe3ff;text-shadow:2px 2px 0 rgba(10,30,60,.35),0 0 12px rgba(77,227,255,.35);margin:8px 0 4px;padding-left:.55em}
.tag{font-size:clamp(17px,2.6vw,24px);letter-spacing:.14em;color:#3f5f86;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.howto-link{background:none;border:0;color:#4a6d98;font-size:18px;letter-spacing:.2em;text-decoration:underline;cursor:pointer;margin-top:10px}
.howto{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:min(680px,92%);background:var(--panel);padding:22px 26px;z-index:30;border:2px solid var(--edge)}
.howto h3{margin:0 0 12px;letter-spacing:.3em;color:#7fe3ff;font-weight:normal;font-size:26px}
.howto p{margin:6px 0;letter-spacing:.1em;font-size:20px;color:#dbe6f7}
.howto .tiers{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;margin-top:14px;align-items:center}
.howto .tiers img{width:22px;height:22px;image-rendering:pixelated}
.home-bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:min(780px,94%);display:flex;flex-direction:column;gap:14px}
.packcard{background:var(--panel);border:3px solid #6fd3f0;padding:14px 18px;position:relative;display:flex;align-items:center;gap:14px;cursor:pointer}
.packcard .badge{position:absolute;top:-16px;left:16px;background:#0b1424;border:2px solid #6fd3f0;color:#9feaff;font-size:15px;letter-spacing:.16em;padding:1px 10px}
.packcard img{width:44px;height:44px;image-rendering:pixelated;filter:drop-shadow(0 0 6px rgba(255,209,102,.5))}
.packcard .pt{font-size:clamp(22px,4vw,32px);letter-spacing:.14em;color:#f2f6ff;line-height:1}
.packcard .pc{font-size:17px;color:var(--dim);letter-spacing:.08em}
.packcard .divers{margin-left:auto;font-size:16px;color:#7fe3ff;white-space:nowrap}
.packcard .divers::before{content:'■ ';color:#4de3ff}
.namebox{display:flex;gap:10px;align-items:center;font-size:17px;letter-spacing:.14em;color:var(--dim)}
.namebox input{flex:1;max-width:260px;background:rgba(8,14,26,.85);border:2px solid var(--edge);color:#e8f0ff;font-size:20px;padding:4px 10px;letter-spacing:.08em}
.homerow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.homerow .lbl{font-size:18px;letter-spacing:.2em;color:#6d8bb4;margin-right:auto}
.played{font-size:18px;color:#ffd166;letter-spacing:.12em;text-align:center}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:40;pointer-events:none;display:none}
body.play #hud{display:block}
.pod{position:absolute;top:10px;background:rgba(14,24,42,.88);padding:6px 16px 4px;min-width:110px}
.pod .l{font-size:13px;letter-spacing:.3em;color:var(--dim)}
.pod .v{font-size:28px;line-height:1;letter-spacing:.04em}
#podD{left:12px}#podD .v{color:#7fe3ff}
#podS{right:12px;text-align:right}#podS .v{color:var(--pink)}
.prog{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center}
.prog .sq{display:inline-block;width:18px;height:18px;margin:0 1px;background:#0d1729;border:2px solid #22324d;vertical-align:middle}
.prog .sq.cur{background:var(--pink);border-color:#ffd0dd;box-shadow:0 0 8px rgba(255,92,138,.6)}
.prog .cap{font-size:14px;letter-spacing:.3em;color:var(--dim);margin-top:4px}
/* PLAY */
.pcard{position:absolute;top:150px;left:14px;right:72px;max-width:900px;background:var(--panel);padding:20px 24px 16px;box-shadow:inset 0 0 0 2px rgba(125,160,210,.18);transition:opacity .4s,transform .4s}
.pcard.gone{opacity:0;transform:translateY(-20px)}
.pcard .n{font-size:16px;letter-spacing:.35em;color:var(--pink)}
.pcard .q{font-size:clamp(28px,5.2vw,46px);color:#f3f6ff;letter-spacing:.03em;line-height:1.05;margin:8px 0 10px;text-shadow:0 0 12px rgba(200,220,255,.18)}
.pcard .h{font-size:15px;letter-spacing:.2em;color:var(--dim)}
.countin{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 22px;font-size:20px;letter-spacing:.2em;color:#b9cbe6;white-space:nowrap}
.countin b{color:#7fe3ff;font-weight:normal}
.abar{position:absolute;left:12px;right:12px;bottom:14px;display:flex;gap:10px;align-items:stretch;max-width:1000px;margin:0 auto;transition:opacity .3s}
.abar.gone{opacity:0;pointer-events:none}
.dial{width:70px;height:70px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;color:#7fe3ff;background:radial-gradient(circle,#0b1526 58%,transparent 59%),conic-gradient(#4de3ff var(--p,100%),#1b2a44 0);box-shadow:0 0 14px rgba(77,227,255,.25)}
.dial.hot{color:#ff5c8a;background:radial-gradient(circle,#0b1526 58%,transparent 59%),conic-gradient(#ff5c8a var(--p,100%),#1b2a44 0)}
.inwrap{flex:1;display:flex;flex-direction:column;gap:4px;justify-content:center}
.ans{width:100%;background:#0b1526;border:2px solid #4fb7d6;color:#f2f6ff;font-size:26px;padding:12px 14px;letter-spacing:.05em;outline:none}
.ans:focus{border-color:#7fe3ff;box-shadow:0 0 12px rgba(77,227,255,.25)}
.tbar{height:5px;background:#4de3ff;transition:width .1s linear}
.tbar.hot{background:var(--pink)}
.dive{width:110px;font-size:26px;letter-spacing:.2em}
.msg{position:absolute;left:0;right:0;bottom:104px;text-align:center;font-size:20px;letter-spacing:.06em;color:#ffb36b;text-shadow:0 0 6px rgba(0,0,0,.8);pointer-events:none;min-height:22px}
.msg small{display:block;font-size:15px;color:var(--dim);letter-spacing:.14em}
.msg.sugg{color:#ffe08a}
.msg.sugg .a{color:#9feaff}
/* world dom */
.tierline{position:absolute;left:8px;right:98px;height:0;border-top:2px dashed rgba(125,147,184,.36);transition:border-color .2s,box-shadow .2s}
.tierline .tg{position:absolute;right:0;top:-24px;display:flex;gap:6px;align-items:center;font-size:16px;letter-spacing:.12em;color:rgba(125,147,184,.8);white-space:nowrap}
.tierline .tg img{width:18px;height:18px;opacity:.55;image-rendering:pixelated}
.tierline.passed{border-top-color:var(--tc);box-shadow:0 0 16px var(--tc)}
.tierline.passed .tg{color:var(--tc);text-shadow:0 0 9px var(--tc)}
.tierline.passed .tg img{opacity:1}
.sinkcard{position:absolute;left:50%;transform:translate(-50%,-50%);padding:10px 24px;background:rgba(14,24,42,.92);color:#ff6b6b;font-size:clamp(24px,4vw,32px);letter-spacing:.1em;text-shadow:0 0 10px rgba(255,90,90,.75);white-space:nowrap;text-transform:uppercase}
.sinkcard::after{content:' ▼';font-size:.7em}
.mascot{position:fixed;z-index:3;width:40px;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,92,138,.55));transition:filter .4s}
.mascot.gold{filter:drop-shadow(0 0 14px rgba(255,209,102,.85))}
.bub{position:fixed;z-index:3;width:6px;height:6px;border:1px solid rgba(200,225,255,.6);border-radius:50%;pointer-events:none;animation:bub 2.6s linear forwards}
@keyframes bub{to{transform:translate(var(--dx),-140px);opacity:0}}
/* REVEAL */
.reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 16px 120px}
.reveal .spr{width:76px;height:76px;image-rendering:pixelated;filter:drop-shadow(0 0 14px var(--tc));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.reveal .tn{font-size:clamp(40px,8vw,68px);letter-spacing:.2em;color:var(--tc);text-shadow:0 0 18px var(--tc);margin:14px 0 6px;line-height:1;padding-left:.2em;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.reveal .aw{font-size:28px;color:#f2f6ff;letter-spacing:.06em}
.reveal .pts{font-size:28px;margin:10px 0 6px;color:#f2f6ff;letter-spacing:.05em}
.reveal .pts b{color:var(--tc);font-weight:normal}
.reveal .fl{font-size:19px;color:var(--dim);letter-spacing:.12em;max-width:680px}
.reveal .fact{margin-top:16px;max-width:640px;background:rgba(11,20,37,.75);border-left:3px solid var(--tc);padding:8px 14px;text-align:left;font-size:20px;color:#dbe6f7;letter-spacing:.04em}
.reveal .fact .src{display:inline-block;font-size:15px;letter-spacing:.16em;color:#0b1220;background:var(--tc);padding:0 6px;margin-right:8px}
.reveal .crowd{margin-top:10px;font-size:16px;letter-spacing:.16em;color:#7fe3ff}
.revbtn{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(260px,70%)}
.flat{width:min(420px,80%);height:60px;margin-bottom:8px}
.flat path{fill:none;stroke:#5d739c;stroke-width:3;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s linear forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.zp{position:fixed;z-index:35;width:8px;height:8px;pointer-events:none;background:repeating-linear-gradient(90deg,#ffd166 0 2px,#3a2a08 2px 4px);animation:zp 1.6s ease-out forwards}
@keyframes zp{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
/* RESULTS / PANELS */
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{width:min(720px,94%);margin:0 auto;padding:76px 0 60px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rhead .dc{font-size:17px;letter-spacing:.24em;color:#9fb5d6}
.bigscore{display:flex;align-items:flex-end;gap:14px;margin:22px 0 4px}
.bigscore .s{font-size:clamp(84px,17vw,128px);line-height:.8;color:#f2f6ff;text-shadow:3px 3px 0 rgba(0,0,0,.4)}
.bigscore .of{font-size:22px;color:var(--dim)}
.bigscore .dm{font-size:22px;color:#7fe3ff}
.bigscore img{margin-left:auto;width:64px;image-rendering:pixelated;filter:drop-shadow(0 0 20px rgba(255,209,102,.6))}
.ptitle{font-size:16px;letter-spacing:.3em;color:#9fb5d6;margin:34px 0 10px;display:flex;align-items:center;gap:12px}
.ptitle::after{content:'';flex:1;border-top:2px dashed rgba(125,147,184,.25)}
.ptitle span{color:#5c7398;letter-spacing:.2em}
.pct{font-size:20px;letter-spacing:.14em;color:#7fe3ff;margin-top:6px}
svg text{font-family:'VT323',monospace}
.bear{width:100%;border-collapse:collapse}
.bear td{padding:10px 8px;border-bottom:1px solid rgba(125,147,184,.18);font-size:19px;color:#8ea6c9;letter-spacing:.05em}
.bear td:first-child{width:34px}.bear td:nth-child(2){width:116px;color:#7fe3ff;white-space:nowrap}
.bear tr.me td{color:#f2f6ff;background:rgba(77,227,255,.06)}
.bear img{width:20px;image-rendering:pixelated}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.actions .btn{flex:1;min-width:180px}
.catch .row{border-bottom:1px solid rgba(125,147,184,.18)}
.catch .top{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer}
.catch .top:hover{background:rgba(77,227,255,.04)}
.catch .num{width:18px;color:#5c7398}
.catch .top img{width:22px;image-rendering:pixelated}
.catch .qq{flex:1}
.catch .qq .q{font-size:15px;letter-spacing:.16em;color:#7189ad;text-transform:uppercase}
.catch .qq .a{font-size:22px;color:#f2f6ff}
.catch .pp{font-size:20px;width:46px;text-align:right}
.catch .plus{width:20px;color:#5c7398}
.catch .list{display:none;padding:2px 0 14px 34px;max-height:420px;overflow-y:auto}
.catch .row.open .list{display:block}
.catch .li{display:flex;gap:10px;align-items:baseline;padding:3px 0;font-size:19px;color:#b7c8e2}
.catch .li img{width:16px;image-rendering:pixelated;align-self:center}
.catch .li .nm{flex:1}
.catch .li .sl{font-size:14px;color:#5c7398;letter-spacing:.1em}
.catch .li .cr{font-size:14px;color:#4de3ff;letter-spacing:.08em}
.catch .li .pv{width:44px;text-align:right}
.catch .li.mine{color:#fff;background:rgba(255,92,138,.1)}
.catch .li .ff{display:block;font-size:16px;color:#7f97bb;letter-spacing:.03em}
.pod-list .pr{display:flex;gap:12px;padding:8px 4px;border-bottom:1px solid rgba(125,147,184,.15);font-size:21px}
.pod-list .pr .rk{width:28px;color:#5c7398}.pod-list .pr .nm{flex:1;color:#dbe6f7}.pod-list .pr .sc{color:var(--pink)}.pod-list .pr .dp{color:#7fe3ff;width:90px;text-align:right}
.pod-list .pr.me{background:rgba(255,92,138,.08)}
.note{font-size:17px;color:#7189ad;letter-spacing:.06em;line-height:1.3}
.panel{background:var(--panel);border:2px solid var(--edge);padding:16px 18px;margin-top:14px}
.lib .item{display:flex;gap:14px;align-items:center;padding:14px;border:2px solid var(--edge);background:rgba(11,20,37,.85);margin-bottom:10px}
.lib .item .t{font-size:26px;color:#f2f6ff;letter-spacing:.06em;line-height:1}
.lib .item .c{font-size:16px;color:var(--dim);letter-spacing:.1em}
.lib .item .mid{flex:1;min-width:0}
.lib .item .sc{font-size:18px;color:#ffd166;letter-spacing:.1em}
.lib .item .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lib .local{font-size:13px;color:#ff9f43;letter-spacing:.14em;border:1px solid #ff9f43;padding:0 5px;margin-left:6px;vertical-align:middle}
h2.h{font-size:34px;letter-spacing:.3em;color:#7fe3ff;font-weight:normal;margin:0 0 6px;text-shadow:0 0 12px rgba(77,227,255,.3)}
.lab label{display:block;font-size:15px;letter-spacing:.24em;color:#8ea6c9;margin:14px 0 6px}
.lab input[type=text],.lab textarea{width:100%;background:#0a1323;border:2px solid var(--edge);color:#e8f0ff;font-size:20px;padding:8px 10px;letter-spacing:.03em;outline:none}
.lab textarea{min-height:110px;resize:vertical;line-height:1.15}
.lab input:focus,.lab textarea:focus{border-color:#6fd3f0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.drop{border:3px dashed #3f6d96;padding:26px 14px;text-align:center;cursor:pointer;background:rgba(10,20,36,.6);color:#9fb5d6;letter-spacing:.12em;font-size:20px}
.drop.over{border-color:#4de3ff;background:rgba(77,227,255,.08);color:#fff}
.drop b{color:#7fe3ff;font-weight:normal}
.srcs .s{display:flex;gap:10px;align-items:center;font-size:18px;padding:6px 2px;border-bottom:1px solid rgba(125,147,184,.15)}
.srcs .s .w{margin-left:auto;color:#7189ad;font-size:15px;letter-spacing:.1em}
.srcs .s button{background:none;border:0;color:#ff7b9b;cursor:pointer;font-size:20px}
.log{background:#040912;border:2px solid #17304d;padding:10px 12px;font-size:17px;color:#6fe39a;min-height:60px;max-height:200px;overflow-y:auto;white-space:pre-wrap;margin-top:12px}
.log .e{color:#ff7b9b}
.rv{border:2px solid var(--edge);background:rgba(11,20,37,.85);margin-bottom:10px}
.rv .hd{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px}
.rv .hd .i{color:#5c7398;width:20px}
.rv .hd input{flex:1 1 calc(100% - 40px);background:transparent;border:0;border-bottom:1px dashed var(--edge);color:#f2f6ff;font-size:22px;outline:none;min-width:0}
.rv .hist{display:flex;gap:2px;height:14px;flex:1;margin-left:30px;min-width:80px}
.rv .hist i{display:block;height:100%}
.rv .tools{display:flex;gap:6px}
.rv .body{display:none;padding:4px 12px 12px 42px}
.rv.open .body{display:block}
.chip{display:inline-flex;align-items:center;gap:5px;margin:3px 4px 3px 0;padding:1px 8px;border:1px solid var(--tc);color:#e6eefb;font-size:17px;background:rgba(0,0,0,.25)}
.chip img{width:14px;image-rendering:pixelated}
.chip button{background:none;border:0;color:#ff7b9b;cursor:pointer;padding:0 0 0 4px;font-size:17px}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1;background:#0a1323;border:1px solid var(--edge);color:#fff;font-size:18px;padding:3px 8px}
.addrow select{background:#0a1323;border:1px solid var(--edge);color:#fff;font-size:17px}
/* menu */
#menu{position:fixed;inset:0;z-index:80;display:none}
#menu.on{display:block}
#menu .shade{position:absolute;inset:0;background:rgba(2,5,10,.6)}
#menu .dr{position:absolute;top:0;left:0;bottom:0;width:min(320px,86%);background:#08111f;border-right:2px solid var(--edge);padding:20px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
#menu .dr a{display:block;padding:10px 6px;color:#cfe0f7;font-size:24px;letter-spacing:.14em;text-decoration:none;cursor:pointer;border-bottom:1px solid rgba(125,147,184,.12)}
#menu .dr a:hover{color:#7fe3ff}

const FILL=new Set(['disease','syndrome','disorder','deficiency','type','the','of','a','an','and','s','s\'']);
function norm(s){
  return String(s).toLowerCase().replace(/α/g,'alpha').replace(/β/g,'beta').replace(/γ/g,'gamma').replace(/δ/g,'delta').replace(/κ/g,'kappa')
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/['’]s\b/g,'').replace(/&/g,' and ').replace(/[^a-z0-9+]+/g,' ').trim();
}
function keyOf(s){ const n=norm(s); const k=n.split(' ').filter(w=>w&&!FILL.has(w)).join(''); return k||n.replace(/ /g,''); }
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){ const cur=[i]; let mn=i;
    for(let j=1;j<=b.length;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); if(cur[j]<mn) mn=cur[j]; }
    if(mn>max) return max+1; prev=cur; }
  return prev[b.length];
}
const thr=l=>l<5?0:l<8?1:l<13?2:3;
function indexPrompt(p){
  if(p._idx) return p._idx; const m=new Map();
  p.ans.forEach((a,i)=>{ [a.n,...(a.a||[])].forEach(s=>{ const k=keyOf(s); if(k&&!m.has(k)) m.set(k,i); }); });
  return p._idx=m;
}
function matchAnswer(p,input){
  const k=keyOf(input); if(!k) return null; const idx=indexPrompt(p);
  if(idx.has(k)) return {exact:true,ans:p.ans[idx.get(k)]};
  let best=null,bd=99;
  for(const [kk,i] of idx){ const t=thr(Math.min(kk.length,k.length)); if(t===0) continue; const d=lev(k,kk,t); if(d<=t&&d<bd){bd=d;best=i;} }
  return best==null?null:{exact:false,ans:p.ans[best]};
}

let G=null;
const TIME=25;
function startDive(pack,practice){
  stopWorld();
  G={pack,practice,idx:0,D:0,score:0,picks:[],phase:'intro',pendingSugg:null};
  show('play'); cam=-30; camTarget=-30; showMarker=true; markerD=0; gold=false; setMascot(); mascotX=.07; mascotTarget=()=>H*.62;

function hud(){
  $('#hudD').textContent=fmt(G?G.D:0)+'m'; $('#hudS').textContent=G?G.score:0;
  const n=G.pack.prompts.length;
  $('#squares').innerHTML=Array.from({length:n},(_,i)=>{ const pk=G.picks[i]; const c=pk?(pk.t==='X'?'var(--t-X)':`var(--t-${pk.t})`):''; return `<span class="sq${i===G.idx&&G.phase!=='done'&&!pk?' cur':''}" style="${c?`background:${c};border-color:${c}`:''}"></span>`; }).join('');
  $('#progCap').textContent=G.phase==='done'?'DIVE COMPLETE':`PROMPT ${Math.min(G.idx+1,n)} OF ${n}`+(G.practice?' · PRACTICE':'');
}
let timerHook=null;
function nextPrompt(first){
  clearWorld();
  const p=G.pack.prompts[G.idx]; G.phase='countin'; G.pendingSugg=null; hud();
  camFree=true; camTarget=G.D+22; markerD=G.D;
  $('#s-play').innerHTML=`
   <div class="pcard ch" id="pc"><div class="n">PROMPT ${G.idx+1} OF ${G.pack.prompts.length}</div><div class="q">${esc(p.q)}</div><div class="h">▼ rarer answers sink deeper ▼</div></div>

     <div class="dial" id="dial">25</div>

     <button class="btn pink dive ch" id="diveBtn">DIVE</button>
   </div>`;
  let c=SET.reduce?1:3; const tick=()=>{ const el=$('#cin'); if(!el) return; el.textContent=c; if(c<=0){ beginClock(); return; } c--; G._ci=setTimeout(tick,850); };
  tick();
}
function beginClock(){
  $('#ci')?.remove(); const ab=$('#abar'); ab.classList.remove('gone'); const inp=$('#ans'); inp.focus();
  G.phase='answer'; G.t0=performance.now(); let lastSec=TIME;
  inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } };
  inp.oninput=()=>{ if(G.pendingSugg && keyOf(inp.value)!==keyOf(G.pendingSugg.n)) { G.pendingSugg=null; } };
  $('#diveBtn').onclick=()=>{ submit(); inp.focus(); };
  timerHook=(t)=>{
    if(G.phase!=='answer') return;
    const left=Math.max(0,TIME-(t-G.t0)/1000); const s=Math.ceil(left);
    const dial=$('#dial'), bar=$('#tbar'); if(!dial) return;
    dial.textContent=s; dial.style.setProperty('--p',(left/TIME*100)+'%'); bar.style.width=(left/TIME*100)+'%';
    const hot=left<=5; dial.classList.toggle('hot',hot); bar.classList.toggle('hot',hot);
    if(hot&&s!==lastSec&&s>0) SFX.tick(); lastSec=s;
    if(left<=0){ timeout(); }
  };
  frameHooks.add(timerHook);
}
function setMsg(html,cls=''){ const m=$('#msg'); if(m){ m.className='msg '+cls; m.innerHTML=html; } }
function submit(){
  if(!G||G.phase!=='answer') return; const inp=$('#ans'); const v=inp.value.trim(); if(!v) return;
  const p=G.pack.prompts[G.idx];
  if(G.pendingSugg && keyOf(v)===keyOf(G.pendingSugg.n)){ land(G.pendingSugg,v); return; }
  const m=matchAnswer(p,v);
  if(!m){ SFX.nope(); setMsg(`"${esc(v)}": no pulse. try again`); inp.select(); return; }
  if(m.exact){ land(m.ans,v); return; }
  G.pendingSugg=m.ans; inp.value=m.ans.n; SFX.click();
  setMsg(`"${esc(v)}" → <span class="a">"${esc(m.ans.n)}"</span><small>submit again to confirm · or edit</small>`,'sugg');
}
function timeout(){
  frameHooks.delete(timerHook); G.phase='landed';
  G.picks[G.idx]={a:null,t:'X',pts:0,n:null}; SFX.flat();
  $('#abar')?.classList.add('gone'); $('#pc')?.classList.add('gone'); setMsg('');
  setTimeout(()=>{ if(G&&G.phase==='landed') showReveal(); },500);
}
let sinkHook=null;
function land(ans,typed){
  frameHooks.delete(timerHook); G.phase='sinking'; SFX.blub();
  const t=ans.t, pts=TIERS[t].pts;
  G.picks[G.idx]={n:ans.n,t,pts,typed};
  $('#abar').classList.add('gone'); $('#pc').classList.add('gone'); setMsg('');
  // tier lines in world
  const base=G.D;
  const lines=ORDER.filter(k=>G.pack.prompts[G.idx].ans.some(a=>a.t===k)||k==='H').map((k,i)=>{
    const el=document.createElement('div'); el.className='tierline'; el.style.setProperty('--tc',`var(--t-${k})`);
    el.innerHTML=`<span class="tg"><img src="${tierSprite(k)}" alt="">${TIERS[k].name==='ONE IN A ZEBRILLION'?'ZEBRA':TIERS[k].name} · ${TIERS[k].pts}</span>`;
    world.appendChild(el); return {k,d:base+TIERS[k].pts*10,el,passed:false};
  });
  const card=document.createElement('div'); card.className='sinkcard ch'; card.textContent=`"${ans.n}"`; world.appendChild(card);
  const target=base+pts*10, dur=SET.reduce?400:(900+pts*15), t0=performance.now()+350;
  let cardD=base; camFree=false;
  const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  let li=0;
  sinkHook=(now)=>{
    const k=clamp((now-t0)/dur,0,1); cardD=base+(target-base)*ease(k);
    cam=cardD+8; markerD=cardD; G.Dlive=cardD;
    $('#hudD').textContent=fmt(cardD)+'m';
    card.style.top=sy(cardD)+'px';
    for(const L of lines){ L.el.style.top=sy(L.d)+'px'; if(!L.passed&&cardD>=L.d-0.5){ L.passed=true; L.el.classList.add('passed'); SFX.line(li++); } }
    if(k>=1){ frameHooks.delete(sinkHook); sinkHook=null; G.D=target; G.score+=pts; hud(); setTimeout(()=>{ if(G&&G.phase==='sinking') showReveal(); },650); }
  };
  frameHooks.add(sinkHook);
  mascotTarget=()=>sy(cardD)+10;
}
function clearWorld(){ world.innerHTML=''; }
function stopWorld(){ if(timerHook) frameHooks.delete(timerHook); if(sinkHook) frameHooks.delete(sinkHook); clearTimeout(G&&G._ci); clearWorld(); }

async function crowdLine(pack,qi,name){

  return `${n} of ${runs.length} divers in your pod said this`;
}

function burst(){ if(SET.reduce) return; for(let i=0;i<46;i++){ const p=document.createElement('div'); p.className='zp'; p.style.left=W/2+'px'; p.style.top=H*.36+'px'; const a=Math.random()*Math.PI*2, r=120+Math.random()*260; p.style.setProperty('--dx',Math.cos(a)*r+'px'); p.style.setProperty('--dy',Math.sin(a)*r+'px'); document.body.appendChild(p); setTimeout(()=>p.remove(),1700); } }

function simulateCurve(pack){
  const base={H:.34,G:.1,S:.24,P:.15,D:.09,Z:.015}, miss=.05, N=2500; const scores=[];
  const per=pack.prompts.map(p=>{ const have=ORDER.filter(t=>p.ans.some(a=>a.t===t)); const ws=have.map(t=>base[t]); const tot=ws.reduce((a,b)=>a+b,0)+miss; return {have,ws:ws.map(w=>w/tot)}; });
  for(let i=0;i<N;i++){ let s=0; for(const q of per){ let r=Math.random(); for(let j=0;j<q.have.length;j++){ if(r<q.ws[j]){ s+=TIERS[q.have[j]].pts; break; } r-=q.ws[j]; } } scores.push(s); }
  return scores;
}
function curveSVG(scores,mine,max){
  const w=600,h=150,pad=8, bins=60; const bw=max/bins; const hist=new Array(bins+1).fill(0);
  scores.forEach(s=>hist[Math.min(bins,Math.floor(s/bw))]++);
  const sm=hist.map((_,i)=>{ let a=0,n=0; for(let k=-3;k<=3;k++){ const v=hist[i+k]; if(v!=null){ const wgt=Math.exp(-k*k/4); a+=v*wgt; n+=wgt; } } return a/n; });
  const mx=Math.max(...sm,1e-6); const X=s=>pad+(w-2*pad)*s/max, Y=v=>h-24-(h-40)*v/mx;
  let d=`M${X(0)} ${Y(0)}`; sm.forEach((v,i)=>d+=` L${X(i*bw).toFixed(1)} ${Y(v).toFixed(1)}`);
  const mv=sm[Math.min(bins,Math.floor(mine/bw))];
  const ticks=[]; for(let s=0;s<=max;s+=100) ticks.push(s);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4de3ff" stop-opacity=".45"/><stop offset="1" stop-color="#4de3ff" stop-opacity=".02"/></linearGradient></defs>
   <path d="${d} L${X(max)} ${h-24} L${X(0)} ${h-24} Z" fill="url(#cg)"/><path d="${d}" fill="none" stroke="#5fc8ea" stroke-width="2.5"/>
   <line x1="${pad}" x2="${w-pad}" y1="${h-24}" y2="${h-24}" stroke="rgba(125,147,184,.35)"/>
   <line x1="${X(mine)}" x2="${X(mine)}" y1="${Y(mv)}" y2="${h-24}" stroke="#ff5c8a" stroke-width="2.5"/><circle cx="${X(mine)}" cy="${Y(mv)}" r="5" fill="#ff5c8a"/>
   ${ticks.map(s=>`<text x="${X(s)}" y="${h-4}" fill="${Math.abs(s-mine)<50?'transparent':'#5c7398'}" font-size="15" text-anchor="middle">${s}</text>`).join('')}
   <text x="${X(mine)}" y="${h-4}" fill="#ff5c8a" font-size="16" text-anchor="middle">YOU</text></svg>`;
}
function logSVG(picks){
  const n=picks.length, w=600,h=330, L=46, R=20, T=26, B=34; const X=i=>L+(w-L-R)*(n===1?.5:i/(n-1)), Y=p=>T+(h-T-B)*p/100;
  let g=''; [0,25,50,75,100].forEach(v=>{ g+=`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(125,147,184,.13)" stroke-dasharray="4 5"/><text x="${L-10}" y="${Y(v)+5}" fill="#5c7398" font-size="14" text-anchor="end">${v?'-'+v:'0m'}</text>`; });
  picks.forEach((p,i)=>{ const x=X(i), c=p.t==='X'?'#5d739c':tcol(p.t);
    if(p.t==='X'){ g+=`<circle cx="${x}" cy="${Y(0)+10}" r="8" fill="none" stroke="${c}" stroke-dasharray="3 3"/>`; }
    else { g+=`<line x1="${x}" x2="${x}" y1="${Y(0)}" y2="${Y(p.pts)}" stroke="${c}" stroke-opacity=".7"/><image href="${tierSprite(p.t)}" x="${x-11}" y="${Y(p.pts)-11}" width="22" height="22" style="image-rendering:pixelated"/>`; }
    g+=`<text x="${x}" y="${h-8}" fill="#5c7398" font-size="15" text-anchor="middle">${i+1}</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${g}</svg>`;
}

function renderResults(){
  if(!G||!G.run) return; show('results'); const pack=G.pack, run=G.run, max=run.max;
  camFree=true; camTarget=G.D+80; markerD=G.D; showMarker=false; mascotTarget=()=>H*.85; mascotX=.04;
  hud();
  const pod=podFor(pack.id).filter(r=>typeof r.score==='number');
  const usePod=pod.length>=3; const scores=usePod?pod.map(r=>r.score):simulateCurve(pack);
  const better=Math.round(100*scores.filter(s=>s<run.score).length/Math.max(1,scores.length));
  const band=BEARING.find(b=>run.score>=b[0]&&run.score<=b[1]);
  const catchRows=pack.prompts.map((p,i)=>{ const pk=run.picks[i]||{t:'X',pts:0};
    const counts={}; pod.forEach(r=>{ const n=r.picks&&r.picks[i]&&r.picks[i].n; if(n){ const k=keyOf(n); counts[k]=(counts[k]||0)+1; } });

function parseJSON(text){

function planPrompt(lecture){

COURSE: ${LAB.meta.course||'(unspecified)'}
STEERING FROM THE CREATOR: ${LAB.meta.steer||'(none)'}

Write 10 candidate prompts, best first. Rules:
- Each prompt starts with "Name a" / "Name an" / "Name one" and asks for ONE short nameable item (a disease, drug, enzyme, structure, sign, gene, organism, lab finding, cell type, nerve, etc.).
- The category must be clearly taught or illustrated in this lecture, but must have at least 8 valid answers in real medicine (ideally 15-80) so there is a spread from obvious to obscure. Avoid categories with fewer than 6 valid answers.
- Answers must be objectively checkable from the wording alone. Avoid opinion, "best", "most important", and multi-part answers.
- Cover different parts of the lecture; vary the kind of thing asked (mechanisms → name the drug/enzyme, presentations → name the disease, etc.).
- For each prompt list "anchors": the valid answers the lecture itself mentions (up to 25), with "where" (e.g. "Slide 12", "Page 4", "transcript") and "emph" from 1 (mentioned once in passing) to 5 (a headline point repeated several times).

Return ONLY JSON, no commentary:
{"title":"catchy pack title, max 40 chars","topic":"one-line summary of the lecture","prompts":[{"q":"Name a ...","anchors":[{"n":"...","where":"Slide 3","emph":4}]}]}

LECTURE MATERIAL (slides marked [Slide n], pages [Page n]):
"""
${lecture}
"""`;
}
function answersPrompt(p){
  return `You are writing the answer key for one prompt in ZEBRILLION, a rarity game for medical students. Players have 25 seconds to type ONE answer. Rare-but-correct answers sink deeper and score more.

LECTURE: ${LAB.meta.title||''} (${LAB.meta.course||''}) — ${LAB.topic||''}
PROMPT: ${p.q}
ANSWERS THE LECTURE ITSELF MENTIONS (where + emphasis 1-5): ${JSON.stringify(p.anchors||[])}
CREATOR STEERING: ${LAB.meta.steer||'(none)'}

List EVERY valid answer you can (aim for 25-90 when the category allows; never pad with wrong ones). Then imagine 100 students from this class answering right after the lecture, and tier each answer:
- "H" Horse (10 pts): the 2-5 answers a big share (>20%) would blurt out — headline examples, mnemonic members, heavily emphasised (emph 4-5) items.
- "G" Gunner (15 pts): 0-3 answers that FEEL clever or niche but that keen students reach for anyway (the "too clever" trap).
- "S" Schooler (30 pts): solid answers roughly 5-20% would give.
- "P" Pearl (60 pts): correct, less common, 1-5%.
- "D" Deep cut (85 pts): correct but rarely named (<1%).
- "Z" exactly ONE answer: the most satisfying obscure-but-valid answer — ideally one the lecture mentioned only in passing (emph 1), rewarding attention.
Lecture emphasis matters: heavily emphasised anchors lean H/S; anchors mentioned once in passing are great P/D/Z picks.

For each answer give:
- "n": canonical name (short, standard spelling)
- "a": aliases players might type — abbreviations, eponyms, alternate names, brand names for drugs, numeral variants (type 1 / type I), British spellings. Do not include aliases that are themselves different valid answers.
- "t": tier letter
- "s": where it appears in the lecture ("Slide 14", "Page 3", "transcript") or "" if not in the lecture
- "f": one crisp, accurate, high-yield fact to remember (max 100 characters). For the Z answer make it a delightful fun fact.
Only include answers that are unambiguously correct for the prompt exactly as worded. If the prompt wording is ambiguous, tighten it in "q".

Return ONLY JSON: {"q":"final prompt wording","ans":[{"n":"","a":[],"t":"H","s":"","f":""}]}`;
}
function cleanPrompt(raw,fallbackQ){

    .filter(a=>{ const k=keyOf(a.n); if(!k||seen.has(k)) return false; seen.add(k); return true; });

  LAB.busy=true; LAB.prompts=[]; LAB.log=''; renderLab(); ac();
  try{
    let limit=180000; try{ const L=CAP.sample.limits&&await CAP.sample.limits(); if(L&&L.maxInputChars) limit=Math.min(limit,L.maxInputChars-12000); }catch(e){}
    let lec=lecture; if(lec.length>limit){ lec=lec.slice(0,limit); log(`> lecture is long — using the first ${fmt(limit)} characters.`); }
    log(`> sounding ${fmt(words(lec))} words of lecture for prompts…`);
    const plan=await askJSON(planPrompt(lec),'complex','planning');
    let cands=(plan.prompts||[]).filter(p=>p&&p.q&&/^name\b/i.test(String(p.q).trim())).map(p=>({q:String(p.q).trim(),anchors:Array.isArray(p.anchors)?p.anchors.slice(0,25):[]}));
    if(cands.length<3) throw new Error('could not find enough promptable categories');
    if(!LAB.meta.title&&plan.title) LAB.meta.title=plan.title; LAB.packTitle=plan.title||LAB.meta.title; LAB.topic=plan.topic||'';
    log(`  ✓ ${cands.length} candidate prompts`);
    const first=cands.slice(0,7); LAB.spares=cands.slice(7);
    const res=await pool(first,2,(c,k)=>chart(c,k,first.length));
    LAB.prompts=res.filter(Boolean);
    while(LAB.prompts.length<7&&LAB.spares.length){ const c=LAB.spares.shift(); const p=await chart(c,LAB.prompts.length,7); if(p) LAB.prompts.push(p); }
    log(`> done. ${LAB.prompts.length} prompts charted. Review below, then publish.`);
  }catch(e){ log('> generation failed: '+(e.code==='not_granted'?'Claude access was not allowed in this page.':(e.message||e.code||e)),true); }
  LAB.busy=false; renderLab(); setTimeout(()=>$('#review')?.scrollIntoView({behavior:'smooth'}),100);
}
function hist(p){ return `<div class="hist">${ORDER.map(t=>{ const n=p.ans.filter(a=>a.t===t).length; return n?`<i style="flex:${n};background:var(--t-${t})" title="${TIERS[t].name}: ${n}"></i>`:''; }).join('')}</div>`; }
function renderReview(){
  const el=$('#review'); if(!el) return; if(!LAB.prompts.length){ el.innerHTML=''; return; }
  const canPub=!!CAP.art&&CAP.canEdit;
  el.innerHTML=`<div class="ptitle">REVIEW THE DIVE <span>${LAB.prompts.length} PROMPTS</span></div>
   <div class="two"><div><label>PACK TITLE</label><input type="text" id="ptitle" value="${esc(LAB.packTitle||LAB.meta.title)}"></div><div><label>CREDIT AS</label><input type="text" id="pby" value="${esc(LS.get('name','')||'')}" placeholder="your name"></div></div>
   <div style="margin-top:12px">${LAB.prompts.map((p,i)=>`<div class="rv" data-i="${i}"><div class="hd"><span class="i">${i+1}</span><input value="${esc(p.q)}" data-q="${i}">${hist(p)}<div class="tools"><button class="btn ghost sm ch" data-open="${i}" title="Show answers">${p.ans.length} ▾</button><button class="btn ghost sm ch" data-rr="${i}" title="Swap for a different prompt">↻</button><button class="btn ghost sm ch" data-x="${i}" title="Remove">✕</button></div></div>
     <div class="body">${ORDER.map(t=>p.ans.map((a,j)=>a.t===t?`<span class="chip" style="--tc:var(--t-${t})" title="${esc(a.f)}"><img src="${tierSprite(t)}" alt="">${esc(a.n)}<button data-dela="${i}:${j}" aria-label="Remove answer">×</button></span>`:'').join('')).join('')}
       <div class="addrow"><input placeholder="add a valid answer" data-addn="${i}"><select data-addt="${i}">${ORDER.map(t=>`<option value="${t}" ${t==='P'?'selected':''}>${TIERS[t].name==='ONE IN A ZEBRILLION'?'ZEBRA':TIERS[t].name}</option>`).join('')}</select><button class="btn ghost sm ch" data-add="${i}">ADD</button><button class="btn ghost sm ch" data-rechart="${i}" title="Re-chart answers for the edited wording">RE-CHART</button></div></div></div>`).join('')}</div>
   <div class="actions">
     <button class="btn pink ch" id="pub">${canPub?'PUBLISH TO EVERYONE ▲':'SAVE ON THIS DEVICE'}</button>
     <button class="btn ghost ch" id="try">TEST DIVE ▼</button>
     <button class="btn ghost ch" id="code">COPY PACK CODE</button></div>
   <p class="note">${canPub?'Publishing adds this dive to the page itself, so anyone with the link can play it.':'Only editors of this page can publish for everyone. Save it here and send the pack code to the page owner to publish.'}</p>`;
  $$('[data-q]',el).forEach(inp=>inp.oninput=()=>{ LAB.prompts[+inp.dataset.q].q=inp.value; });
  $$('[data-open]',el).forEach(b=>b.onclick=()=>b.closest('.rv').classList.toggle('open'));
  $$('[data-x]',el).forEach(b=>b.onclick=()=>{ LAB.prompts.splice(+b.dataset.x,1); renderReview(); });
  $$('[data-dela]',el).forEach(b=>b.onclick=()=>{ const [i,j]=b.dataset.dela.split(':').map(Number); const p=LAB.prompts[i]; const wasZ=p.ans[j].t==='Z'; p.ans.splice(j,1); if(wasZ){ const c=p.ans.find(a=>a.t==='D'); if(c) c.t='Z'; } delete p._idx; const open=b.closest('.rv').classList.contains('open'); renderReview(); if(open) $(`.rv[data-i="${i}"]`).classList.add('open'); });
  $$('[data-add]',el).forEach(b=>b.onclick=()=>{ const i=+b.dataset.add; const n=$(`[data-addn="${i}"]`).value.trim(); const t=$(`[data-addt="${i}"]`).value; if(!n) return; const p=LAB.prompts[i]; if(t==='Z') p.ans.forEach(a=>{ if(a.t==='Z') a.t='D'; }); p.ans.push({n,a:[],t,s:'',f:''}); delete p._idx; renderReview(); $(`.rv[data-i="${i}"]`).classList.add('open'); });
  $$('[data-rr]',el).forEach(b=>b.onclick=async()=>{ const i=+b.dataset.rr; if(!LAB.spares.length){ toast('NO SPARE PROMPTS LEFT — EDIT THE WORDING AND RE-CHART',3000); return; } b.disabled=true; const c=LAB.spares.shift(); const p=await chart(c,i,LAB.prompts.length); if(p){ LAB.prompts[i]=p; } renderReview(); });
  $$('[data-rechart]',el).forEach(b=>b.onclick=async()=>{ const i=+b.dataset.rechart; b.disabled=true; b.innerHTML='<span class="spin">✳</span>'; const old=LAB.prompts[i]; const p=await chart({q:old.q,anchors:old.anchors||[]},i,LAB.prompts.length); if(p) LAB.prompts[i]=p; renderReview(); });
  $('#pub').onclick=()=>savePack(canPub);
  $('#try').onclick=()=>{ const p=assemblePack(); if(p) startDive(p,true); };
  $('#code').onclick=()=>{ const p=assemblePack(); if(p) copyText(packCode(p)); };
}
function assemblePack(){
  const prompts=LAB.prompts.filter(p=>p.q&&p.ans.length>=3).slice(0,7).map(p=>({q:p.q.trim(),ans:p.ans.map(a=>({n:a.n,a:a.a,t:a.t,s:a.s,f:a.f}))}));
  if(prompts.length<3){ toast('NEED AT LEAST 3 PROMPTS',2500); return null; }
  const title=($('#ptitle')?.value||LAB.packTitle||LAB.meta.title||'Untitled lecture').trim().slice(0,48);
  const by=($('#pby')?.value||'').trim().slice(0,24);
  return {id:(LAB.packId||(LAB.packId=(Date.now().toString(36)+Math.random().toString(36).slice(2,6)))),title,course:(LAB.meta.course||'').trim().slice(0,60),by,created:Date.now(),prompts};
}
function packCode(p){ return 'ZBPACK:'+JSON.stringify({id:p.id,title:p.title,course:p.course,by:p.by,created:p.created,prompts:p.prompts.map(q=>({q:q.q,ans:q.ans}))}); }
function validPack(p){ return p&&typeof p.title==='string'&&Array.isArray(p.prompts)&&p.prompts.length>=1&&p.prompts.every(q=>q&&typeof q.q==='string'&&Array.isArray(q.ans)&&q.ans.every(a=>a&&typeof a.n==='string'&&'HGSPDZ'.includes(a.t))); }
async function savePack(canPub,given){
  const p=given||assemblePack(); if(!p) return;
  if(canPub){
    toast('PUBLISHING…',4000);
    const ok=await publishData({...DATA,packs:[...DATA.packs.filter(x=>x.id!==p.id),p]},p.id);
    if(ok) return; // page reloads
    toast('PUBLISH FAILED — SAVED ON THIS DEVICE',3000);
  }
  LS.set('localPacks',[...localPacks().filter(x=>x.id!==p.id),p]); LS.set('lastPack',p.id);
  modal(`<div class="ptitle">SAVED ON THIS DEVICE</div><p class="note">"${esc(p.title)}" is in your library here. To put it on the shared page, send this pack code to the page owner — they paste it into Import.</p><div class="actions"><button class="btn pink ch" id="cpc">COPY PACK CODE</button><button class="btn ghost ch" id="dv">DIVE IT NOW ▼</button></div>`, m=>{
    $('#cpc',m).onclick=()=>copyText(packCode(p)); $('#dv',m).onclick=()=>{ m.remove(); startDive(findPack(p.id)||p,false); }; });
}
function importCode(){
  const raw=$('#imp').value.trim().replace(/^ZBPACK:/,''); let p;
  try{ p=JSON.parse(raw); }catch(e){ toast('THAT PACK CODE DOES NOT PARSE',2500); return; }
  if(!validPack(p)){ toast('THAT DOES NOT LOOK LIKE A PACK',2500); return; }
  p={id:String(p.id||Date.now().toString(36)).replace(/[^a-z0-9-]/gi,'').slice(0,24)||Date.now().toString(36),title:p.title.slice(0,48),course:String(p.course||'').slice(0,60),by:String(p.by||'').slice(0,24),created:p.created||Date.now(),prompts:p.prompts.slice(0,7).map(q=>cleanPrompt(q,q.q))};
  savePack(!!CAP.art&&CAP.canEdit,p);
}

/* ---------------- boot ---------------- */
function onCapsReady(){
  if(CAP.db){ loadPod().then(()=>{ if(view==='home') goHome(); }); }
  const after=LS.get('after',null);
  if(after){ LS.set('after',null); const p=findPack(after); if(p){ location.hash='dive-'+p.id; goHome();
    modal(`<div class="ptitle">PUBLISHED</div><p class="note">"${esc(p.title)}" is live on this page.${ART_URL?' Send this link:':''}</p>${ART_URL?`<textarea readonly style="height:60px">${esc(shareLink(p))}</textarea>`:''}<div class="actions"><button class="btn pink ch" id="cpl">COPY LINK</button><button class="btn ghost ch" id="cpc">COPY PACK CODE</button><button class="btn ghost ch" data-close>DONE</button></div><p class="note">Pack code = what you paste into packs.txt on the website.</p>`, m=>{ $('#cpl',m).onclick=()=>copyText(shareLink(p)); $('#cpc',m).onclick=()=>copyText(packCode(p)); }); } }
  if(view==='lab') renderLab();
}
addEventListener('resize',resize);
addEventListener('hashchange',()=>{ if(location.hash==='#lab') goLab(); else if(view==='home'||view==='library') goHome(); });
async function loadPackFile(){
  if(ON_CLAUDE) return;
  try{ const r=await fetch('packs.txt',{cache:'no-store'}); if(!r.ok) return; const txt=await r.text(); let added=0;
    for(const line of txt.split(/\r?\n/)){ const l=line.trim(); if(!l.startsWith('ZBPACK:')) continue;
      try{ const p=JSON.parse(l.slice(7)); if(validPack(p)&&p.id&&!DATA.packs.some(x=>x.id===p.id)){ DATA.packs.push(p); added++; } }catch(e){ console.warn('bad pack line',e); } }
    if(added&&(view==='home'||view==='library')){ view==='home'?goHome():goLibrary(); }
  }catch(e){}
}
resize(); mascotY=H*.6; applySettings(); if(location.hash==='#lab') goLab(); else goHome(); requestAnimationFrame(frame);
loadPackFile();
initCaps();
})();
</script>
